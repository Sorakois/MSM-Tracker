<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>MSM Egg-Zapping Tracker (Wublin / Celestial / Amber)</title>
  <style>
    :root {
      --bg-main: #e6dfd3;
      --bg-row: #efe9de;
      --bg-row-alt: #e8e1d5;
      --bg-header: #2c2623;
      --text-main: #2b2520;
      --text-muted: #6e6459;
      --green-name: #1b632c;
      --border-line: #b8afa0;
      --accent-red: #d11919;
      --accent-green: #2e8b57;
      --accent-gold: #d4a017;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 60px;
    }

    header {
      background: var(--bg-header);
      color: #f7f3eb;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 10px rgba(0,0,0,0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand h1 {
      font-size: 1.18rem;
      font-weight: 700;
    }
    .save-pill {
      font-size: 0.74rem;
      background: #3a4f3c;
      color: #a7f3d0;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid #527955;
    }
    .source-pill {
      font-size: 0.74rem;
      background: #3b352f;
      color: #f7d78a;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid #6b5c47;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tab-btn {
      background: #403833;
      color: #ddd4c8;
      border: 1px solid #594e47;
      padding: 7px 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: #524741; }
    .tab-btn.active {
      background: var(--accent-gold);
      color: #1f1a17;
      border-color: #f3c64f;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .btn {
      background: #403833;
      color: #f4eee6;
      border: 1px solid #63574f;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #574c45; }
    .btn-gold {
      background: #614916;
      border-color: #b5892b;
      color: #fce7b2;
    }
    .btn-gold:hover { background: #7a5c1c; }
    .btn-danger { background: #5c2626; border-color: #823535; }
    .btn-danger:hover { background: #783030; }

    .sub-bar {
      max-width: 1280px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #ded6c6;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-line);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 0.86rem;
    }
    .search-input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #9e9484;
      background: #fbf9f5;
      font-size: 0.86rem;
      width: 220px;
    }

    .help-hint {
      font-size: 0.8rem;
      color: #4f463d;
      background: #f5efe4;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px dashed #a89e8e;
    }
    .help-hint b { color: var(--accent-red); }

    .shopping-summary {
      background: #f7f3eb;
      border: 1px solid var(--border-line);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .shopping-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      font-weight: 700;
      color: #3d342b;
    }
    .shopping-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .shop-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #cbbba0;
      padding: 3px 9px 3px 5px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .shop-egg-img {
      width: 22px;
      height: 24px;
      object-fit: contain;
    }

    /* Main Table */
    .table-container {
      max-width: 1280px;
      margin: 12px auto;
      padding: 0 16px;
    }
    .wiki-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-row);
      border: 1px solid var(--border-line);
      border-radius: 6px;
      overflow: hidden;
    }
    .wiki-table tr {
      border-bottom: 1px solid var(--border-line);
      transition: background 0.12s;
    }
    .wiki-table tr:nth-child(even) { background: var(--bg-row-alt); }
    .wiki-table tr.row-completed {
      background: #dfeadf;
      opacity: 0.86;
    }
    .wiki-table td {
      padding: 14px 12px;
      vertical-align: middle;
      text-align: center;
    }

    .col-monster {
      width: 175px;
    }
    .monster-portrait-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .monster-img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.18));
    }
    .monster-name {
      color: var(--green-name);
      font-weight: 700;
      font-size: 1.02rem;
      line-height: 1.15;
    }
    .monster-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .pin-btn {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #9c9283;
      background: #f5f0e6;
      cursor: pointer;
      font-weight: 600;
    }
    .pin-btn.pinned {
      background: #ffe8e8;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .col-eggs {
      min-width: 480px;
    }
    .eggs-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 12px;
      margin-bottom: 8px;
    }

    .egg-item {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      width: 90px;
      padding: 7px 5px;
      border-radius: 8px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(0,0,0,0.09);
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s, background 0.12s;
    }
    .egg-item:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.9);
      border-color: #8f8474;
    }
    .egg-item.egg-done {
      background: rgba(212, 237, 218, 0.68);
      border-color: #5cb85c;
    }

    .egg-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      height: 44px;
    }

    .egg-sprite-box {
      position: relative;
      width: 40px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .egg-img {
      width: 40px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.22));
      position: relative;
      z-index: 2;
    }

    .egg-svg-fallback {
      width: 38px;
      height: 42px;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .egg-scribble {
      display: none;
      position: absolute;
      inset: -2px;
      width: 42px;
      height: 46px;
      pointer-events: none;
      z-index: 4;
    }
    .egg-item.egg-done .egg-scribble {
      display: block;
    }

    .egg-req {
      font-size: 0.86rem;
      font-weight: 800;
      color: #1f1b18;
      margin-left: 1px;
    }

    .egg-label {
      font-size: 0.69rem;
      font-weight: 600;
      color: #3b332b;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82px;
    }

    .tally-box {
      min-height: 18px;
      margin-top: 2px;
      font-family: 'Comic Sans MS', 'Bradley Hand', cursive, sans-serif;
      font-size: 0.82rem;
      font-weight: 900;
      color: var(--accent-red);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex-wrap: wrap;
    }
    .tally-group-five {
      text-decoration: line-through;
      text-decoration-thickness: 2.2px;
      text-decoration-color: var(--accent-red);
      margin-right: 2px;
    }
    .tally-fraction {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.67rem;
      color: #6b5f52;
      font-weight: 700;
    }

    .total-line {
      font-size: 0.9rem;
      font-weight: 700;
      color: #2b2520;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .progress-pill {
      font-size: 0.76rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: #ded5c5;
      color: #332c25;
    }
    .progress-pill.complete {
      background: var(--accent-green);
      color: #fff;
    }

    .col-cost {
      width: 115px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .col-time {
      width: 85px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .col-actions {
      width: 110px;
    }
    .row-btn {
      display: block;
      width: 100%;
      margin-bottom: 5px;
      padding: 4px 6px;
      font-size: 0.73rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #9c9283;
      background: #f7f3eb;
      cursor: pointer;
    }
    .row-btn:hover { background: #e8dfd1; }

    @media (max-width: 860px) {
      .wiki-table, .wiki-table tbody, .wiki-table tr, .wiki-table td {
        display: block;
        width: 100%;
      }
      .wiki-table tr {
        margin-bottom: 12px;
        border: 2px solid var(--border-line);
        border-radius: 8px;
      }
      .col-eggs { min-width: unset; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>⚡ MSM Egg-Zapping Tracker</h1>
      <span class="save-pill" id="saveIndicator">✓ Auto-saved locally</span>
      <span class="source-pill" id="sourceIndicator">📁 Using Local ./msm_assets/</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="wublins" onclick="switchTab('wublins')">Wublins</button>
      <button class="tab-btn" data-tab="celestials" onclick="switchTab('celestials')">Young Celestials</button>
      <button class="tab-btn" data-tab="adults" onclick="switchTab('adults')">Adult Celestials</button>
      <button class="tab-btn" data-tab="amber" onclick="switchTab('amber')">Amber Vessels</button>
    </div>

    <div class="toolbar-actions">
      <button class="btn btn-gold" onclick="document.getElementById('recipesFile').click()" title="Load msm_recipes.json generated by build_msm_tracker.py">📂 Load msm_recipes.json</button>
      <input type="file" id="recipesFile" style="display:none" accept=".json" onchange="loadScrapedRecipesFile(event)" />
      <button class="btn" onclick="exportProgress()">Export Progress</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">Import Progress</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importProgress(event)" />
      <button class="btn btn-danger" onclick="resetCurrentTab()">Reset Tab</button>
    </div>
  </header>

  <div class="sub-bar">
    <div class="controls-row">
      <div class="filter-group">
        <input type="text" class="search-input" id="searchInput" placeholder="Search monster or egg (e.g. Riff, PomPom)..." oninput="render()" />
        <label style="cursor:pointer; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="filterActiveOnly" onchange="render()" />
          Show Only Active / In-Progress
        </label>
        <label style="cursor:pointer; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="hideCompleted" onchange="render()" />
          Hide Awakened (100%)
        </label>
      </div>

      <div class="help-hint">
        <b>Left-Click Egg:</b> +1 Tally &nbsp;|&nbsp; <b>Right-Click Egg:</b> -1 Tally &nbsp;|&nbsp; <b>Shift + Click:</b> Cross Out / Max
      </div>
    </div>

    <div class="shopping-summary" id="shoppingSummary">
      <div class="shopping-header">
        <span>Remaining Eggs Needed (Active / In-Progress in Current Tab):</span>
        <span style="font-weight:400; font-size:0.77rem;">Pin or tally any monster below to include its remaining eggs here</span>
      </div>
      <div class="shopping-pills" id="shoppingPills"></div>
    </div>
  </div>

  <div class="table-container">
    <table class="wiki-table">
      <tbody id="monsterTableBody"></tbody>
    </table>
  </div>

  <script>
    const STORAGE_KEY = "msm_zap_tracker_v2";
    const SCRAPED_DB_CACHE_KEY = "msm_scraped_recipes_cache_v1";

    // Helper matching build_msm_tracker.py's safe_filename() so ./msm_assets/ paths match 1:1
    function safeFilename(name) {
      return name.trim().replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    // Color-coded SVG fallback if a local PNG hasn't been downloaded yet
    const EGG_STYLE = {
      "Entbrat": { c1: "#e07a24", c2: "#8f3f09", spot: "#5eb327" },
      "Deedge": { c1: "#4da6ff", c2: "#154c91", spot: "#ffffff" },
      "Riff": { c1: "#c852e0", c2: "#5d1873", spot: "#49b6ff" },
      "Shellbeat": { c1: "#e05573", c2: "#2c7da6", spot: "#7be3f2" },
      "Quarrister": { c1: "#b5b3a8", c2: "#5e5c54", spot: "#d9c27e" },
      "T-Rox": { c1: "#8c8275", c2: "#4a433b", spot: "#b89f5d" },
      "Bowgart": { c1: "#6385b5", c2: "#31445e", spot: "#a3c4f2" },
      "Clamble": { c1: "#5c7548", c2: "#242b1f", spot: "#dbca60" },
      "Pummel": { c1: "#4b8f7a", c2: "#8f3b56", spot: "#80e0c2" },
      "Congle": { c1: "#d69878", c2: "#7a4b30", spot: "#ffffff" },
      "PomPom": { c1: "#ff5ca8", c2: "#a8195b", spot: "#ffaae0" },
      "Scups": { c1: "#6298d9", c2: "#264770", spot: "#a6d1ff" },
      "Thumpies": { c1: "#96ab54", c2: "#4d5924", spot: "#d487b8" },
      "Spunge": { c1: "#86cf38", c2: "#43730e", spot: "#c9f285" },
      "Reedling": { c1: "#cf4e38", c2: "#3c8538", spot: "#f5d76e" },
      "Drumpler": { c1: "#e67335", c2: "#94350c", spot: "#f5c87a" },
      "Fwog": { c1: "#3cd19f", c2: "#166e50", spot: "#3785d9" },
      "Maw": { c1: "#f05995", c2: "#8f1b49", spot: "#f5c449" },
      "Furcorn": { c1: "#70db32", c2: "#2c7309", spot: "#b9f582" },
      "Oaktopus": { c1: "#5c8fd6", c2: "#234473", spot: "#87bf47" },
      "Shrubb": { c1: "#87633a", c2: "#3f6e20", spot: "#a3d95b" },
      "Pango": { c1: "#525252", c2: "#1f1f1f", spot: "#e68a2e" },
      "Quibble": { c1: "#ff8533", c2: "#9e4004", spot: "#ffd269" },
      "Cybop": { c1: "#b87b4b", c2: "#366f87", spot: "#85d6f2" },
      "Dandidoo": { c1: "#d8eba4", c2: "#6b8c29", spot: "#ffffff" },
      "Noggin": { c1: "#857e76", c2: "#423d38", spot: "#aba39a" },
      "Mammott": { c1: "#f7f7f7", c2: "#adadad", spot: "#ffffff" },
      "Toe Jammer": { c1: "#33b5ff", c2: "#0b5885", spot: "#99dcff" },
      "Potbelly": { c1: "#5cd12e", c2: "#226308", spot: "#eb8934" },
      "Tweedle": { c1: "#d66db5", c2: "#73285b", spot: "#f5aee0" },
      "Kayna": { c1: "#ff621f", c2: "#8f2400", spot: "#ffbe4f" }
    };

    function buildEggSVG(eggName) {
      const isFlex = eggName.includes("Flex");
      const st = isFlex
        ? { c1: "#f59e0b", c2: "#6d28d9", spot: "#fde047" }
        : (EGG_STYLE[eggName] || { c1: "#9c7a54", c2: "#4d3924", spot: "#dfc29f" });
      const gradId = "eg_" + safeFilename(eggName);
      const label = isFlex ? "FLEX" : eggName.slice(0, 3).toUpperCase();

      return `
        <svg class="egg-svg-fallback" viewBox="0 0 40 44">
          <defs>
            <radialGradient id="${gradId}" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="${st.c1}" />
              <stop offset="100%" stop-color="${st.c2}" />
            </radialGradient>
          </defs>
          <path d="M20,3 C30,3 36,16 36,27 C36,36 29,41 20,41 C11,41 4,36 4,27 C4,16 10,3 20,3 Z"
                fill="url(#${gradId})" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
          <circle cx="14" cy="15" r="3.2" fill="${st.spot}" opacity="0.65"/>
          <circle cx="26" cy="19" r="2.5" fill="${st.spot}" opacity="0.6"/>
          <circle cx="15" cy="28" r="2.8" fill="${st.spot}" opacity="0.55"/>
          <text x="20" y="26" text-anchor="middle" fill="#fff" font-size="7.5" font-weight="800"
                stroke="rgba(0,0,0,0.75)" stroke-width="2" paint-order="stroke">${label}</text>
        </svg>
      `;
    }

    // Default Built-In Database (automatically overridden when msm_recipes.json is loaded)
    let MONSTER_DB = {
      wublins: [
        { id: "pixolotl", name: "Pixolotl", cost: "34,000 Coins", time: "14d", eggs: [["Entbrat",6], ["Furcorn",6], ["Riff",10], ["Scups",8], ["T-Rox",8], ["Cybop",14], ["Fwog",10]] },
        { id: "bona-petite", name: "Bona-Petite", cost: "20,000 Coins", time: "10d", eggs: [["Riff",5], ["Entbrat",5], ["PomPom",6], ["Bowgart",6], ["T-Rox",6], ["Fwog",10], ["Drumpler",10], ["Maw",10], ["Mammott",10]] },
        { id: "maulch", name: "Maulch", cost: "17,000 Coins", time: "7d", eggs: [["Quarrister",4], ["Entbrat",4], ["Spunge",6], ["Pummel",6], ["Clamble",4], ["Furcorn",8], ["Noggin",6]] },
        { id: "fleechwurm", name: "Fleechwurm", cost: "5,000 Coins", time: "5d", eggs: [["Shellbeat",3], ["Quarrister",3], ["Reedling",3], ["Spunge",3], ["Scups",4], ["Dandidoo",4], ["Furcorn",4]] },
        { id: "brump", name: "Brump", cost: "2,000 Coins", time: "2d", eggs: [["Furcorn",6], ["Fwog",2]] },
        { id: "zynth", name: "Zynth", cost: "3,000 Coins", time: "3d", eggs: [["Pango",1], ["Oaktopus",1], ["Drumpler",1], ["Maw",1], ["Congle",1], ["T-Rox",1]] },
        { id: "poewk", name: "Poewk", cost: "5,000 Coins", time: "5d", eggs: [["Shellbeat",1], ["Reedling",1], ["PomPom",2], ["Scups",1], ["Clamble",1], ["Pango",1], ["Oaktopus",1], ["Shrubb",1], ["Dandidoo",2]] },
        { id: "thwok", name: "Thwok", cost: "17,000 Coins", time: "7d", eggs: [["Entbrat",1], ["Deedge",1], ["Riff",1], ["Shellbeat",1], ["Quarrister",1], ["Bowgart",4], ["PomPom",4], ["Spunge",4], ["Furcorn",4], ["Quibble",4]] },
        { id: "dwumrohl", name: "Dwumrohl", cost: "34,000 Coins", time: "14d", eggs: [["Entbrat",3], ["Deedge",3], ["Riff",3], ["Shellbeat",3], ["Quarrister",3], ["Bowgart",4], ["PomPom",4], ["Reedling",4], ["Scups",2], ["Thumpies",2], ["Congle",4], ["Pummel",2], ["Clamble",2], ["T-Rox",4], ["Fwog",4], ["Drumpler",4], ["Maw",4], ["Mammott",8], ["Noggin",8]] },
        { id: "zuuker", name: "Zuuker", cost: "20,000 Coins", time: "10d", eggs: [["Entbrat",2], ["Deedge",2], ["Bowgart",4], ["T-Rox",6], ["Oaktopus",6], ["Furcorn",6], ["Fwog",8]] },

        "maulch__Clamble": 1,
        "maulch__Furcorn": 6,
        "maulch__Noggin": 5,
        "fleechwurm__Shellbeat": 1,
        "fleechwurm__Quarrister": 3,
        "fleechwurm__Reedling": 3,
        "fleechwurm__Spunge": 3,
        "fleechwurm__Scups": 4
      },
      pinned: {
        "pixolotl": true,
        "bona-petite": true,
        "maulch": true,
        "fleechwurm": true
      }
    };

    let currentTab = "wublins";
    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("msm_zap_tracker_local_v1") || localStorage.getItem("msm_zap_tracker_v1");
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_USER_STATE));
          return JSON.parse(JSON.stringify(INITIAL_USER_STATE));
        }
        return JSON.parse(raw);
      } catch (e) {
        return JSON.parse(JSON.stringify(INITIAL_USER_STATE));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const pill = document.getElementById("saveIndicator");
      pill.textContent = "✓ Saved just now";
      setTimeout(() => { pill.textContent = "✓ Auto-saved locally"; }, 1200);
    }

    // Load cached scraped recipes from localStorage or fetch ./msm_recipes.json automatically
    async function initScrapedRecipes() {
      const pill = document.getElementById("sourceIndicator");
      try {
        const cached = localStorage.getItem(SCRAPED_DB_CACHE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.monsters) {
            MONSTER_DB = parsed.monsters;
            EGG_IMAGES = parsed.eggs || {};
            pill.textContent = "✅ Loaded Scraped Wiki Recipes (msm_recipes.json)";
            updateTabCounts();
            render();
          }
        }
      } catch (e) {}

      // Also attempt to fetch ./msm_recipes.json directly if served over HTTP/Live Server
      try {
        const resp = await fetch("./msm_recipes.json");
        if (resp.ok) {
          const data = await resp.json();
          if (data && data.monsters) {
            MONSTER_DB = data.monsters;
            EGG_IMAGES = data.eggs || {};
            localStorage.setItem(SCRAPED_DB_CACHE_KEY, JSON.stringify(data));
            pill.textContent = "✅ Synced ./msm_recipes.json + ./msm_assets/";
            updateTabCounts();
            render();
          }
        }
      } catch (e) {
        // Running on file:// protocol — local <img src="msm_assets/..."> still works directly!
      }
    }

    // Manual file picker for msm_recipes.json when running on file:// without a local web server
    function loadScrapedRecipesFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.monsters) {
            MONSTER_DB = parsed.monsters;
            EGG_IMAGES = parsed.eggs || {};
            localStorage.setItem(SCRAPED_DB_CACHE_KEY, JSON.stringify(parsed));
            document.getElementById("sourceIndicator").textContent = "✅ Loaded msm_recipes.json";
            updateTabCounts();
            render();
          } else {
            alert("This JSON file does not look like msm_recipes.json.");
          }
        } catch (err) {
          alert("Failed to parse JSON file.");
        }
      };
      reader.readAsText(file);
    }

    function getMonsterImgSrc(monster) {
      if (monster.local_img) return monster.local_img;
      return `msm_assets/monsters/${monster.id}.png`;
    }

    function getEggImgSrc(eggName) {
      if (EGG_IMAGES[eggName]) return EGG_IMAGES[eggName];
      return `msm_assets/eggs/${safeFilename(eggName)}.png`;
    }

    function updateTabCounts() {
      ["wublins", "celestials", "adults", "amber"].forEach(tab => {
        const count = (MONSTER_DB[tab] || []).length;
        const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
        const label = {
          wublins: "Wublins",
          celestials: "Young Celestials",
          adults: "Adult Celestials",
          amber: "Amber Vessels"
        }[tab];
        if (btn) btn.textContent = count > 0 ? `${label} (${count})` : label;
      });
    }

    function formatTalliesHTML(count, req) {
      if (count <= 0) return `<span class="tally-fraction">0/${req}</span>`;
      const fives = Math.floor(count / 5);
      const ones = count % 5;
      let html = "";
      for (let i = 0; i < fives; i++) {
        html += `<span class="tally-group-five">||||</span> `;
      }
      if (ones > 0) {
        html += `<span>${"|".repeat(ones)}</span>`;
      }
      html += ` <span class="tally-fraction">(${count}/${req})</span>`;
      return html;
    }

    function handleEggClick(event, monsterId, eggName, reqCount) {
      event.preventDefault();
      const key = `${monsterId}__${eggName}`;
      const current = state.tallies[key] || 0;

      if (event.shiftKey) {
        state.tallies[key] = current >= reqCount ? 0 : reqCount;
      } else if (event.type === "contextmenu" || event.button === 2) {
        state.tallies[key] = Math.max(0, current - 1);
      } else {
        state.tallies[key] = current >= reqCount ? 0 : current + 1;
      }

      saveState();
      render();
    }

    function togglePin(monsterId) {
      state.pinned[monsterId] = !state.pinned[monsterId];
      saveState();
      render();
    }

    function fillAllMonster(monsterId) {
      const monsters = MONSTER_DB[currentTab] || [];
      const monster = monsters.find(m => m.id === monsterId);
      if (!monster) return;
      monster.eggs.forEach(([eggName, req]) => {
        state.tallies[`${monster.id}__${eggName}`] = req;
      });
      saveState();
      render();
    }

    function clearMonster(monsterId) {
      const monsters = MONSTER_DB[currentTab] || [];
      const monster = monsters.find(m => m.id === monsterId);
      if (!monster) return;
      monster.eggs.forEach(([eggName]) => {
        delete state.tallies[`${monster.id}__${eggName}`];
      });
      saveState();
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
      });
      render();
    }

    function renderShoppingSummary(monsters) {
      const neededMap = {};
      monsters.forEach(m => {
        let zapped = 0;
        let total = 0;
        m.eggs.forEach(([eggName, req]) => {
          zapped += Math.min(req, state.tallies[`${m.id}__${eggName}`] || 0);
          total += req;
        });
        const isInProgress = (zapped > 0 && zapped < total) || state.pinned[m.id];
        if (isInProgress && zapped < total) {
          m.eggs.forEach(([eggName, req]) => {
            const cur = state.tallies[`${m.id}__${eggName}`] || 0;
            const rem = Math.max(0, req - cur);
            if (rem > 0) {
              neededMap[eggName] = (neededMap[eggName] || 0) + rem;
            }
          });
        }
      });

      const container = document.getElementById("shoppingPills");
      const entries = Object.entries(neededMap).sort((a, b) => b[1] - a[1]);

      if (entries.length === 0) {
        container.innerHTML = `<span style="font-size:0.8rem; color:#6e6459;">No remaining eggs on pinned/in-progress monsters in this tab. Click any egg below to start tracking!</span>`;
        return;
      }

      container.innerHTML = entries.map(([eggName, rem]) => {
        const eggSrc = getEggImgSrc(eggName);
        return `
          <span class="shop-pill">
            <img class="shop-egg-img" src="${eggSrc}" alt="" onerror="this.style.display='none'" />
            ${eggName}: <strong style="color:var(--accent-red)">x${rem}</strong>
          </span>
        `;
      }).join("");
    }

    function render() {
      const monsters = MONSTER_DB[currentTab] || [];
      const tbody = document.getElementById("monsterTableBody");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const activeOnly = document.getElementById("filterActiveOnly").checked;
      const hideCompleted = document.getElementById("hideCompleted").checked;

      renderShoppingSummary(monsters);
      tbody.innerHTML = "";

      monsters.forEach(monster => {
        let totalReq = 0;
        let totalZapped = 0;
        monster.eggs.forEach(([eggName, req]) => {
          totalReq += req;
          totalZapped += Math.min(req, state.tallies[`${monster.id}__${eggName}`] || 0);
        });

        const isCompleted = totalZapped >= totalReq;
        const isPinned = !!state.pinned[monster.id];
        const isActive = isPinned || (totalZapped > 0 && !isCompleted);

        if (activeOnly && !isActive) return;
        if (hideCompleted && isCompleted) return;
        if (search) {
          const matchName = monster.name.toLowerCase().includes(search);
          const matchEgg = monster.eggs.some(([e]) => e.toLowerCase().includes(search));
          if (!matchName && !matchEgg) return;
        }

        const tr = document.createElement("tr");
        if (isCompleted) tr.className = "row-completed";

        const monsterSrc = getMonsterImgSrc(monster);
        const remoteFallback = monster.img_url || "";

        const eggsHTML = monster.eggs.map(([eggName, req]) => {
          const cur = Math.min(req, state.tallies[`${monster.id}__${eggName}`] || 0);
          const done = cur >= req;
          const eggSrc = getEggImgSrc(eggName);
          const safeEggName = eggName.replace(/'/g, "\\'");

          return `
            <div class="egg-item ${done ? 'egg-done' : ''}"
                 onclick="handleEggClick(event, '${monster.id}', '${safeEggName}', ${req})"
                 oncontextmenu="handleEggClick(event, '${monster.id}', '${safeEggName}', ${req})"
                 title="${eggName}: ${cur}/${req} zapped (Left-click +1, Right-click -1, Shift+click Cross out)">
              <div class="egg-visual">
                <div class="egg-sprite-box">
                  ${buildEggSVG(eggName)}
                  <img class="egg-img" src="${eggSrc}" alt="" loading="lazy"
                       onload="if(this.previousElementSibling)this.previousElementSibling.style.display='none'"
                       onerror="this.style.display='none'" />
                  <svg class="egg-scribble" viewBox="0 0 40 44">
                    <path d="M4,6 L36,38 M36,6 L4,38 M2,22 L38,18 M6,32 L34,10"
                          stroke="#d11919" stroke-width="3.8" stroke-linecap="round"/>
                  </svg>
                </div>
                <span class="egg-req">x${req}</span>
              </div>
              <div class="egg-label">${eggName}</div>
              <div class="tally-box">${formatTalliesHTML(cur, req)}</div>
            </div>
          `;
        }).join("");

        tr.innerHTML = `
          <td class="col-monster">
            <div class="monster-portrait-wrap">
              <img class="monster-img" src="${monsterSrc}" alt="${monster.name}" loading="lazy"
                   onerror="if('${remoteFallback}' && this.src !== '${remoteFallback}'){this.src='${remoteFallback}';}else{this.style.display='none';}" />
              <div class="monster-name">${monster.name}</div>
              <div class="monster-sub">${isCompleted ? '✅ Completed!' : (totalReq - totalZapped) + ' eggs left'}</div>
              <button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin('${monster.id}')">
                ${isPinned ? '📌 Working On' : 'Pin to Active'}
              </button>
            </div>
          </td>
          <td class="col-eggs">
            <div class="eggs-wrap">${eggsHTML}</div>
            <div class="total-line">
              <span>(${totalReq} Total)</span>
              <span class="progress-pill ${isCompleted ? 'complete' : ''}">
                ${totalZapped} / ${totalReq} Zapped (${Math.round((totalZapped/totalReq)*100)}%)
              </span>
            </div>
          </td>
          <td class="col-cost">${monster.cost}</td>
          <td class="col-time">${monster.time}</td>
          <td class="col-actions">
            <button class="row-btn" onclick="fillAllMonster('${monster.id}')">✓ Fill All</button>
            <button class="row-btn" onclick="clearMonster('${monster.id}')">↺ Clear Row</button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function resetCurrentTab() {
      if (!confirm(`Clear all egg tallies for ${currentTab.toUpperCase()}?`)) return;
      const monsters = MONSTER_DB[currentTab] || [];
      monsters.forEach(m => {
        m.eggs.forEach(([eggName]) => {
          delete state.tallies[`${m.id}__${eggName}`];
        });
      });
      saveState();
      render();
    }

    function exportProgress() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `msm-zap-progress-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importProgress(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.tallies) {
            state = parsed;
            saveState();
            render();
          }
        } catch (err) {
          alert("Invalid JSON backup file.");
        }
      };
      reader.readAsText(file);
    }

    updateTabCounts();
    render();
    initScrapedRecipes();
  </script>
</body>
</html>
