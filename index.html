<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="referrer" content="no-referrer" />
  <title>My Singing Monsters — Egg Zap Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
  <script src="msm_recipes.js" onerror=""></script>

  <style>
    :root {
      /* Authentic MSM In-Game Dialog Palette */
      --bg-cosmos-top: #142230;
      --bg-cosmos-bot: #0b131c;

      --frame-wood-outer: #241409;
      --frame-wood-mid: #4d2d18;
      --frame-wood-inner: #6e4224;
      --frame-gold-trim: #d99b26;

      --parchment-light: #f4ead5;
      --parchment-main: #e6d7b9;
      --parchment-slot: #d2c09d;
      --parchment-slot-border: #ad9670;

      /* Glossy 3D MSM Game Buttons */
      --btn-green-top: #80f545;
      --btn-green-bot: #2ca10c;
      --btn-green-lip: #155703;

      --btn-gold-top: #ffe552;
      --btn-gold-bot: #e08b00;
      --btn-gold-lip: #7a4600;

      --btn-blue-top: #5ce1ff;
      --btn-blue-bot: #0088cc;
      --btn-blue-lip: #00466e;

      --btn-red-top: #ff6b6b;
      --btn-red-bot: #c91e1e;
      --btn-red-lip: #690b0b;

      --btn-stone-top: #8f7e68;
      --btn-stone-bot: #5c4f3f;
      --btn-stone-lip: #332b22;

      --text-choc: #2e1c0e;
      --text-muted: #66503a;
      --tally-red: #d41c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1f354a 0%, var(--bg-cosmos-top) 45%, var(--bg-cosmos-bot) 100%);
      background-attachment: fixed;
      color: var(--text-choc);
      min-height: 100vh;
      padding-bottom: 72px;
    }

    /* Crisp Outlined Game Display Text (Matches MSM's Outlined Font) */
    .game-font {
      font-family: 'Lilita One', cursive, sans-serif;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow:
        0 2px 0 #1f1107,
        -1.5px -1.5px 0 #1f1107,
        1.5px -1.5px 0 #1f1107,
        -1.5px 1.5px 0 #1f1107,
        1.5px 1.5px 0 #1f1107;
    }

    /* Top Wooden Game Header Bar */
    header {
      background: linear-gradient(180deg, #59351c 0%, #382010 85%, #241409 100%);
      border-bottom: 4px solid var(--frame-gold-trim);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.5rem;
      color: #ffe261;
      line-height: 1.1;
    }

    .save-indicator {
      font-size: 0.76rem;
      font-weight: 700;
      background: rgba(15, 23, 30, 0.65);
      color: #9ef09e;
      padding: 4px 11px;
      border-radius: 99px;
      border: 1.5px solid #48b848;
    }

    /* Island Switcher Tabs */
    .island-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.4px;
      padding: 8px 15px;
      border-radius: 12px;
      cursor: pointer;
      color: #e8dac3;
      background: linear-gradient(180deg, #6e4527 0%, #422714 100%);
      border: 2px solid #8f5d38;
      box-shadow: 0 4px 0 #1f1107, inset 0 2px 0 rgba(255, 255, 255, 0.2);
      text-shadow: 0 1.5px 0 #1f1107;
      transition: transform 0.08s, filter 0.12s;
      white-space: normal;
      text-align: center;
    }
    .tab-btn:hover { filter: brightness(1.08); }
    .tab-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1f1107;
    }
    .tab-btn.active {
      background: linear-gradient(180deg, var(--btn-gold-top) 0%, var(--btn-gold-bot) 100%);
      color: #ffffff;
      border-color: #fff5b8;
      box-shadow: 0 4px 0 var(--btn-gold-lip), inset 0 2px 0 rgba(255, 255, 255, 0.65);
      text-shadow:
        0 2px 0 #593100,
        -1px -1px 0 #593100,
        1px -1px 0 #593100,
        -1px 1px 0 #593100,
        1px 1px 0 #593100;
    }

    /* 3D Glossy Game Buttons */
    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-btn {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.86rem;
      letter-spacing: 0.4px;
      padding: 8px 13px;
      border-radius: 11px;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(180deg, var(--btn-stone-top) 0%, var(--btn-stone-bot) 100%);
      border: 2px solid #b5a38b;
      box-shadow: 0 4px 0 var(--btn-stone-lip), inset 0 2px 0 rgba(255, 255, 255, 0.35);
      text-shadow:
        0 1.5px 0 #1f160e,
        -1px -1px 0 #1f160e,
        1px -1px 0 #1f160e,
        -1px 1px 0 #1f160e,
        1px 1px 0 #1f160e;
      transition: transform 0.08s, filter 0.12s;
      white-space: normal;
      overflow-wrap: break-word;
      text-align: center;
      line-height: 1.15;
    }
    .game-btn:hover { filter: brightness(1.08); }
    .game-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--btn-stone-lip);
    }

    .game-btn-green {
      background: linear-gradient(180deg, var(--btn-green-top) 0%, var(--btn-green-bot) 100%);
      border-color: #c4ff9e;
      box-shadow: 0 4px 0 var(--btn-green-lip), inset 0 2px 0 rgba(255, 255, 255, 0.55);
    }
    .game-btn-green:active { box-shadow: 0 2px 0 var(--btn-green-lip); }

    .game-btn-gold {
      background: linear-gradient(180deg, var(--btn-gold-top) 0%, var(--btn-gold-bot) 100%);
      border-color: #fff2a6;
      box-shadow: 0 4px 0 var(--btn-gold-lip), inset 0 2px 0 rgba(255, 255, 255, 0.55);
    }
    .game-btn-gold:active { box-shadow: 0 2px 0 var(--btn-gold-lip); }

    .game-btn-blue {
      background: linear-gradient(180deg, var(--btn-blue-top) 0%, var(--btn-blue-bot) 100%);
      border-color: #b3f0ff;
      box-shadow: 0 4px 0 var(--btn-blue-lip), inset 0 2px 0 rgba(255, 255, 255, 0.55);
    }
    .game-btn-blue:active { box-shadow: 0 2px 0 var(--btn-blue-lip); }

    .game-btn-red {
      background: linear-gradient(180deg, var(--btn-red-top) 0%, var(--btn-red-bot) 100%);
      border-color: #ffb3b3;
      box-shadow: 0 4px 0 var(--btn-red-lip), inset 0 2px 0 rgba(255, 255, 255, 0.45);
    }
    .game-btn-red:active { box-shadow: 0 2px 0 var(--btn-red-lip); }

    /* Main Content Container */
    .main-container {
      max-width: 1320px;
      margin: 18px auto 0;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Carved Wood & Stone Filter Bar */
    .controls-frame {
      background: linear-gradient(180deg, #4f301a 0%, #362010 100%);
      border: 3px solid var(--frame-wood-inner);
      outline: 2px solid var(--frame-wood-outer);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.12);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid #241409;
      background: var(--parchment-light);
      color: var(--text-choc);
      width: 250px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      outline: none;
    }
    .search-box:focus {
      border-color: var(--frame-gold-trim);
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(20, 10, 4, 0.45);
      color: #f4ead5;
      font-size: 0.86rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1.5px solid #6e4224;
      cursor: pointer;
      user-select: none;
      flex-wrap: wrap;
    }
    .check-pill input {
      width: 16px;
      height: 16px;
      accent-color: #f59e0b;
      cursor: pointer;
    }

    .controls-hint {
      font-size: 0.82rem;
      font-weight: 600;
      color: #e6d3b3;
      line-height: 1.3;
    }

    /* Remaining Eggs Needed (In-Game Parchment Banner) */
    .breeding-queue-board {
      background: linear-gradient(180deg, var(--parchment-light) 0%, var(--parchment-main) 100%);
      border: 4px solid var(--frame-wood-mid);
      outline: 2px solid var(--frame-wood-outer);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), inset 0 2px 0 #ffffff;
    }

    .queue-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--parchment-slot-border);
    }

    .queue-title-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .queue-title {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 1.12rem;
      color: var(--text-choc);
      letter-spacing: 0.3px;
    }

    .active-count-badge {
      background: #4d2d18;
      color: #ffe261;
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 99px;
      letter-spacing: 0.4px;
    }

    .queue-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .queue-pill {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      background: var(--parchment-slot);
      border: 2px solid var(--parchment-slot-border);
      padding: 4px 10px 4px 6px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-choc);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.12), 0 1px 0 rgba(255, 255, 255, 0.6);
      white-space: normal;
      overflow-wrap: break-word;
    }

    .queue-egg-img {
      width: 26px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
    }

    .queue-qty {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.92rem;
      color: #ffffff;
      background: var(--tally-red);
      padding: 1px 8px;
      border-radius: 8px;
      text-shadow: 0 1px 0 #590000;
    }

    /* Monster Inventory Boards */
    .monster-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .monster-board {
      background: linear-gradient(180deg, var(--parchment-light) 0%, var(--parchment-main) 100%);
      border: 4px solid var(--frame-wood-mid);
      outline: 2px solid var(--frame-wood-outer);
      border-radius: 20px;
      padding: 16px;
      display: grid;
      grid-template-columns: 200px 1fr 165px;
      gap: 16px;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.8);
    }

    .monster-board.board-active {
      border-color: var(--frame-gold-trim);
      box-shadow: 0 0 0 2px rgba(255, 226, 97, 0.35), 0 8px 20px rgba(0, 0, 0, 0.55), inset 0 2px 0 #ffffff;
    }

    .monster-board.board-completed {
      background: linear-gradient(180deg, #e5f5dc 0%, #c8e6b8 100%);
      border-color: #2ca10c;
    }

    /* Left Column: Monster Medallion, Name, Time Limit & Copies Stepper */
    .monster-pedestal-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding-right: 14px;
      border-right: 2px solid var(--parchment-slot-border);
    }

    .pedestal-left-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .monster-medallion {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #fff9eb 0%, var(--parchment-slot) 75%);
      border: 3px solid var(--parchment-slot-border);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.2), 0 2px 0 rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .monster-img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.28));
    }

    .copy-number-tag {
      position: absolute;
      top: -4px;
      right: -6px;
      background: linear-gradient(180deg, var(--btn-gold-top), var(--btn-gold-bot));
      border: 2px solid #241409;
      padding: 2px 8px;
      border-radius: 99px;
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.78rem;
      color: #ffffff;
      text-shadow: 0 1px 0 #4d2800;
    }

    .monster-title {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 1.25rem;
      color: #3b2310;
      line-height: 1.15;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .time-badge {
      display: inline-block;
      background: rgba(77, 45, 24, 0.14);
      border: 1.5px solid var(--parchment-slot-border);
      color: var(--text-choc);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 99px;
    }

    /* Copies Stepper (e.g. 2 Zynths, 3 Poewks) */
    .copies-stepper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--parchment-slot);
      border: 2px solid var(--parchment-slot-border);
      padding: 4px 8px;
      border-radius: 12px;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.12);
    }

    .copies-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-choc);
    }

    .stepper-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 1rem;
      color: #ffffff;
      background: linear-gradient(180deg, #785a3c 0%, #4d3822 100%);
      border: 1.5px solid #2b1d10;
      box-shadow: 0 2px 0 #241409;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #241409;
    }

    .copies-val {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.95rem;
      min-width: 18px;
      text-align: center;
      color: var(--text-choc);
    }

    /* Center Column: Recessed MSM Inventory Egg Slots */
    .inventory-well-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .eggs-slot-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: stretch;
    }

    /* Authentic MSM Recessed Inventory Egg Slot */
    .egg-slot {
      flex: 0 1 112px;
      min-width: 104px;
      background: var(--parchment-slot);
      border: 2px solid var(--parchment-slot-border);
      border-radius: 14px;
      padding: 8px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      user-select: none;
      box-shadow:
        inset 0 3px 5px rgba(0, 0, 0, 0.16),
        0 2px 0 rgba(255, 255, 255, 0.65);
      transition: transform 0.08s, border-color 0.12s, background 0.12s;
    }

    .egg-slot:hover {
      border-color: #785a3c;
      background: #dfd0b2;
    }

    .egg-slot.slot-complete {
      background: linear-gradient(180deg, #d7f7c6 0%, #b3e89b 100%);
      border-color: #2ca10c;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.6),
        0 3px 0 rgba(21, 87, 3, 0.25);
    }

    .egg-tap-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      flex: 1;
    }

    .egg-stage {
      position: relative;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .egg-sprite-wrap {
      position: relative;
      width: 44px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .egg-img {
      width: 44px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.28));
      position: relative;
      z-index: 2;
    }

    .egg-svg-fallback {
      width: 40px;
      height: 44px;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Red Cross-Out Scribble When Slot is Complete */
    .egg-scribble {
      display: none;
      position: absolute;
      inset: -2px;
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 4;
    }
    .egg-slot.slot-complete .egg-scribble {
      display: block;
    }

    /* Outlined Game Counter Badge in Corner of Slot */
    .egg-counter-badge {
      position: absolute;
      top: -4px;
      right: 0px;
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.82rem;
      color: #ffffff;
      background: rgba(36, 20, 9, 0.78);
      padding: 1px 6px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 5;
      text-shadow: 0 1px 0 #000;
    }
    .egg-slot.slot-complete .egg-counter-badge {
      background: #1f7a06;
      border-color: #a8ff8a;
    }

    /* Wrapping Egg Name (Never Truncates with "...") */
    .egg-name-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-choc);
      text-align: center;
      line-height: 1.18;
      margin-top: 5px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* Red Tally Marks Row */
    .tally-row {
      min-height: 18px;
      margin: 3px 0 5px;
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.8rem;
      color: var(--tally-red);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3px;
    }
    .tally-five {
      text-decoration: line-through;
      text-decoration-thickness: 2.2px;
      text-decoration-color: var(--tally-red);
      margin-right: 2px;
    }

    /* Tactile Micro Game Buttons inside Each Egg Slot (-, +, MAX) */
    .slot-btn-row {
      display: flex;
      width: 100%;
      gap: 4px;
      margin-top: auto;
    }

    .slot-micro-btn {
      flex: 1;
      min-height: 24px;
      padding: 2px 3px;
      border-radius: 7px;
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.3px;
      color: #ffffff;
      cursor: pointer;
      border: 1.5px solid #2b1d10;
      background: linear-gradient(180deg, #8c7355 0%, #5e4b35 100%);
      box-shadow: 0 2px 0 #2b1d10;
      text-shadow: 0 1px 0 #1f1208;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot-micro-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #2b1d10;
    }
    .slot-btn-plus {
      background: linear-gradient(180deg, var(--btn-gold-top) 0%, var(--btn-gold-bot) 100%);
      border-color: #693b00;
      box-shadow: 0 2px 0 #4d2b00;
      text-shadow: 0 1px 0 #4d2b00;
    }
    .slot-btn-max {
      background: linear-gradient(180deg, var(--btn-green-top) 0%, var(--btn-green-bot) 100%);
      border-color: #164f05;
      box-shadow: 0 2px 0 #0f3802;
      text-shadow: 0 1px 0 #0f3802;
    }

    /* Monster Total Progress Meter */
    .meter-bar-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: var(--parchment-slot);
      border: 2px solid var(--parchment-slot-border);
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .meter-track {
      flex: 1;
      min-width: 120px;
      height: 14px;
      background: #422a17;
      border-radius: 99px;
      padding: 2px;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.5);
    }

    .meter-fill {
      height: 100%;
      background: linear-gradient(180deg, #88ff4d 0%, #29a30b 100%);
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    .meter-label {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 0.88rem;
      color: var(--text-choc);
      white-space: normal;
    }

    /* Right Column: Board Action Buttons */
    .board-actions-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 14px;
      border-left: 2px solid var(--parchment-slot-border);
    }

    /* Mobile & Tablet Responsive Breakpoints */
    @media (max-width: 920px) {
      .monster-board {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .monster-pedestal-col {
        border-right: none;
        border-bottom: 2px solid var(--parchment-slot-border);
        padding-right: 0;
        padding-bottom: 12px;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        text-align: left;
      }
      .pedestal-left-wrap {
        flex-direction: row;
        width: auto;
        text-align: left;
        gap: 12px;
      }
      .monster-medallion {
        width: 74px;
        height: 74px;
      }
      .monster-img {
        width: 64px;
        height: 64px;
      }
      .board-actions-col {
        border-left: none;
        border-top: 2px solid var(--parchment-slot-border);
        padding-left: 0;
        padding-top: 12px;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .board-actions-col .game-btn {
        flex: 1 1 130px;
      }
    }

    @media (max-width: 520px) {
      .search-box { width: 100%; }
      .egg-slot {
        flex: 1 1 calc(33.333% - 8px);
        min-width: 96px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand-group">
        <h1 class="brand-title game-font">My Singing Monsters: Zap Tracker</h1>
        <span class="save-indicator" id="saveIndicator">Saved Locally</span>
      </div>

      <nav class="island-tabs">
        <button class="tab-btn active" data-tab="wublins" onclick="switchTab('wublins')">Wublin Island (20)</button>
        <button class="tab-btn" data-tab="celestials" onclick="switchTab('celestials')">Young Celestials (12)</button>
        <button class="tab-btn" data-tab="adults" onclick="switchTab('adults')">Adult Celestials (12)</button>
        <button class="tab-btn" data-tab="amber" onclick="switchTab('amber')">Amber Island (31)</button>
      </nav>

      <div class="toolbar-actions">
        <button class="game-btn" onclick="exportProgress()">Export Backup</button>
        <button class="game-btn" onclick="document.getElementById('importFile').click()">Import Backup</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importProgress(event)" />
        <button class="game-btn game-btn-red" onclick="resetCurrentTab()">Reset Tab</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Filter & Search Bar -->
    <section class="controls-frame">
      <div class="filter-group">
        <input type="text" class="search-box" id="searchInput" placeholder="Search monster or egg..." oninput="render()" />
        <label class="check-pill">
          <input type="checkbox" id="filterActiveOnly" onchange="render()" />
          <span>📌 Pinned / In-Progress Only</span>
        </label>
        <label class="check-pill">
          <input type="checkbox" id="hideCompleted" onchange="render()" />
          <span>Hide Awakened (100%)</span>
        </label>
      </div>
      <div class="controls-hint">
        Use <b>Copies [ - / + ]</b> on any monster to track multiple active statues at once (such as 2 Zynths or 3 Poewks).

    let LOCAL_EGG_IMAGES = {};

    // Clean-slate state: 0 tallies, 0 pre-pinned statues

      tallies: {},
      pinned: {},
      instances: {}

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(CLEAN_INITIAL_STATE));
          return JSON.parse(JSON.stringify(CLEAN_INITIAL_STATE));
        }
        const parsed = JSON.parse(raw);
        parsed.tallies = parsed.tallies || {};
        parsed.pinned = parsed.pinned || {};
        parsed.instances = parsed.instances || {};
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(CLEAN_INITIAL_STATE));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const pill = document.getElementById("saveIndicator");
      pill.textContent = "Saved Just Now";
      setTimeout(() => { pill.textContent = "Saved Locally"; }, 1200);
    }

    function loadImgMap() {
      try { return JSON.parse(localStorage.getItem(IMG_MAP_KEY) || "{}"); }
      catch (e) { return {}; }
    }

    function saveImgMap() {
      try { localStorage.setItem(IMG_MAP_KEY, JSON.stringify(imgMap)); }
      catch (e) {}
    }

    function getInstancesForMonster(monsterId) {
      const arr = state.instances[monsterId];
      if (!arr || !Array.isArray(arr) || arr.length === 0) return [1];
      return arr;
    }

    function addMonsterCopy(monsterId) {
      const current = getInstancesForMonster(monsterId).slice();
      const nextNum = Math.max(...current) + 1;
      current.push(nextNum);
      state.instances[monsterId] = current;
      state.pinned[`${monsterId}#${nextNum}`] = true;
      if (current.length === 2) {
        state.pinned[`${monsterId}#${current[0]}`] = true;
      }
      saveState();
      render();
    }

    function removeMonsterCopy(monsterId, instNum) {
      const current = getInstancesForMonster(monsterId).slice();
      const instKey = `${monsterId}#${instNum}`;

      Object.keys(state.tallies).forEach(k => {
        if (k.startsWith(instKey + "__")) delete state.tallies[k];
      });
      delete state.pinned[instKey];

      if (current.length > 1) {
        state.instances[monsterId] = current.filter(n => n !== instNum);
      } else {
        state.instances[monsterId] = [1];
      }
      saveState();
      render();
    }

    function decrementMonsterCopy(monsterId) {
      const current = getInstancesForMonster(monsterId);
      if (current.length <= 1) {
        removeMonsterCopy(monsterId, current[0]);
        return;
      }
      const lastNum = current[current.length - 1];
      removeMonsterCopy(monsterId, lastNum);
    }

    function getMonsterWikiFile(monster) {
      if (monster.imgFile) return monster.imgFile;
      const clean = monster.name
        .replace(/\s*\([^)]*\)/g, "")
        .replace(/\s+Vessel$/i, "")
        .trim()
        .replace(/\s+/g, "_");
      return `${clean}.png`;
    }

    function getEggWikiFiles(eggName) {
      if (eggName.includes("Mythical Flex")) return ["Spooktacle_Mythical_Flex-Egg.png"];
      if (eggName.includes("Flex")) return ["Rare_Double-Element_Fire_Flex-Egg.png"];
      const clean = eggName.trim().replace(/\s+/g, "_");
      return [`${clean}_Egg.png`, `${clean}-egg.png`];
    }

    function getMonsterImgUrl(monster) {
      if (monster.local_img) return monster.local_img;
      const f = getMonsterWikiFile(monster);
      return imgMap[f] || imgMap[f.replace(/_/g, " ")] || `msm_assets/monsters/${monster.id}.png`;
    }

    function getEggImgUrl(eggName) {
      if (LOCAL_EGG_IMAGES[eggName]) return LOCAL_EGG_IMAGES[eggName];
      const candidates = getEggWikiFiles(eggName);
      for (const f of candidates) {
        const hit = imgMap[f] || imgMap[f.replace(/_/g, " ")];
        if (hit) return hit;
      }
      return `msm_assets/eggs/${safeFilename(eggName)}.png`;
    }

    function fetchWikiImageBatchJSONP(fileList) {
      return new Promise((resolve) => {
        const cbName = "msmImgCB_" + Math.random().toString(36).slice(2);
        const titlesParam = fileList.map(f => "File:" + f).join("|");
        const script = document.createElement("script");
        const timeout = setTimeout(() => { cleanup(); resolve(); }, 7000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(data) {
          cleanup();
          try {
            if (!data || !data.query) return resolve();
            const rev = {};
            const link = (from, to) => {
              if (!rev[to]) rev[to] = new Set();
              rev[to].add(from);
            };
            (data.query.normalized || []).forEach(n => link(n.from, n.to));
            (data.query.redirects || []).forEach(r => {
              link(r.from, r.to);
              if (rev[r.from]) rev[r.from].forEach(o => link(o, r.to));
            });

            Object.values(data.query.pages || {}).forEach(page => {
              if (page.imageinfo && page.imageinfo[0] && page.imageinfo[0].url) {
                const cleanUrl = page.imageinfo[0].url.split("/revision/")[0];
                const allKeys = new Set([page.title]);
                if (rev[page.title]) rev[page.title].forEach(k => allKeys.add(k));
                allKeys.forEach(k => {
                  const stripped = k.replace(/^File:/i, "");
                  imgMap[stripped] = cleanUrl;
                  imgMap[stripped.replace(/\s+/g, "_")] = cleanUrl;
                  imgMap[stripped.replace(/_/g, " ")] = cleanUrl;
                });
              }
            });
          } catch (e) {}
          resolve();
        };

        script.src = `https://mysingingmonsters.fandom.com/api.php?action=query&redirects=1&titles=${encodeURIComponent(titlesParam)}&prop=imageinfo&iiprop=url&format=json&callback=${cbName}`;
        script.onerror = () => { cleanup(); resolve(); };
        document.body.appendChild(script);
      });
    }

    async function syncOnlineSprites() {
      const needed = new Set();
      const tabOrder = [currentTab, ...["wublins", "celestials", "adults", "amber"].filter(t => t !== currentTab)];
      tabOrder.forEach(tab => {
        (MONSTER_DB[tab] || []).forEach(m => {
          const mf = getMonsterWikiFile(m);
          if (!imgMap[mf]) needed.add(mf);
          m.eggs.forEach(([eggName]) => {
            getEggWikiFiles(eggName).forEach(ef => {
              if (!imgMap[ef]) needed.add(ef);
            });
          });
        });
      });

      const list = Array.from(needed);
      for (let i = 0; i < list.length; i += 40) {
        await fetchWikiImageBatchJSONP(list.slice(i, i + 40));
        saveImgMap();
        render();
      }
    }

    function formatTalliesHTML(count) {
      if (count <= 0) return "";
      const fives = Math.floor(count / 5);
      const ones = count % 5;
      let html = "";
      for (let i = 0; i < fives; i++) {
        html += `<span class="tally-five">||||</span>`;
      }
      if (ones > 0) {
        html += `<span>${"|".repeat(ones)}</span>`;
      }
      return html;
    }

    function adjustEggTally(instKey, eggName, reqCount, mode, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const key = `${instKey}__${eggName}`;
      const current = state.tallies[key] || 0;

      if (mode === "max" || (event && event.shiftKey)) {
        state.tallies[key] = current >= reqCount ? 0 : reqCount;
      } else if (mode === "minus" || (event && (event.type === "contextmenu" || event.button === 2))) {
        state.tallies[key] = Math.max(0, current - 1);
      } else {
        state.tallies[key] = current >= reqCount ? 0 : current + 1;
      }

      saveState();
      render();
    }

    function togglePinInstance(instKey) {
      state.pinned[instKey] = !state.pinned[instKey];
      saveState();
      render();
    }

    function fillAllInstance(monsterId, instKey) {
      const m = (MONSTER_DB[currentTab] || []).find(x => x.id === monsterId);
      if (!m) return;
      m.eggs.forEach(([eggName, req]) => {
        state.tallies[`${instKey}__${eggName}`] = req;
      });
      saveState();
      render();
    }

    function clearInstance(monsterId, instKey) {
      const m = (MONSTER_DB[currentTab] || []).find(x => x.id === monsterId);
      if (!m) return;
      m.eggs.forEach(([eggName]) => {
        delete state.tallies[`${instKey}__${eggName}`];
      });
      saveState();
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
      });
      render();
    }

    function renderShoppingSummary(monsters) {
      const neededMap = {};
      let activeInstancesCount = 0;

      monsters.forEach(m => {
        const instances = getInstancesForMonster(m.id);
        instances.forEach(instNum => {
          const instKey = `${m.id}#${instNum}`;
          let zapped = 0;
          let total = 0;
          m.eggs.forEach(([eggName, req]) => {
            zapped += Math.min(req, state.tallies[`${instKey}__${eggName}`] || 0);
            total += req;
          });

          const isWorking = (zapped > 0 && zapped < total) || !!state.pinned[instKey];
          if (isWorking && zapped < total) {
            activeInstancesCount++;
            m.eggs.forEach(([eggName, req]) => {
              const cur = Math.min(req, state.tallies[`${instKey}__${eggName}`] || 0);
              const rem = Math.max(0, req - cur);
              if (rem > 0) {
                neededMap[eggName] = (neededMap[eggName] || 0) + rem;
              }
            });
          }
        });
      });

      document.getElementById("activeStatuesBadge").textContent = `${activeInstancesCount} Active`;

      const container = document.getElementById("shoppingPills");
      const entries = Object.entries(neededMap).sort((a, b) => b[1] - a[1]);

      if (entries.length === 0) {
        container.innerHTML = `<span style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">No active statues yet. Tap any egg slot below, click <b>"📌 Pin Statue"</b>, or increase <b>Copies [+]</b> to build your breeding list.</span>`;
        return;
      }

      container.innerHTML = entries.map(([eggName, rem]) => {
        const eggUrl = getEggImgUrl(eggName);
        return `
          <span class="queue-pill">
            <img class="queue-egg-img" src="${eggUrl}" alt="" onerror="this.style.display='none'" />
            <span>${eggName}</span>
            <span class="queue-qty">x${rem}</span>
          </span>
        `;
      }).join("");
    }

    function render() {
      const monsters = MONSTER_DB[currentTab] || [];
      const container = document.getElementById("monsterListContainer");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const activeOnly = document.getElementById("filterActiveOnly").checked;
      const hideCompleted = document.getElementById("hideCompleted").checked;

      renderShoppingSummary(monsters);
      container.innerHTML = "";

      monsters.forEach(monster => {
        if (search) {
          const matchName = monster.name.toLowerCase().includes(search);
          const matchEgg = monster.eggs.some(([e]) => e.toLowerCase().includes(search));
          if (!matchName && !matchEgg) return;
        }

        const instances = getInstancesForMonster(monster.id);
        const totalCopies = instances.length;

        instances.forEach((instNum, idx) => {
          const instKey = `${monster.id}#${instNum}`;
          let totalReq = 0;
          let totalZapped = 0;

          monster.eggs.forEach(([eggName, req]) => {
            totalReq += req;
            totalZapped += Math.min(req, state.tallies[`${instKey}__${eggName}`] || 0);
          });

          const isCompleted = totalZapped >= totalReq;
          const isPinned = !!state.pinned[instKey];
          const isActive = isPinned || (totalZapped > 0 && !isCompleted);

          if (activeOnly && !isActive) return;
          if (hideCompleted && isCompleted) return;

          const pct = totalReq > 0 ? Math.round((totalZapped / totalReq) * 100) : 0;
          const board = document.createElement("article");
          board.className = `monster-board ${isCompleted ? "board-completed" : (isActive ? "board-active" : "")}`;

          const monsterImgUrl = getMonsterImgUrl(monster);
          const displayTitle = totalCopies > 1 ? `${monster.name} #${idx + 1}` : monster.name;

          const eggsHTML = monster.eggs.map(([eggName, req], eggIdx) => {
            const cur = Math.min(req, state.tallies[`${instKey}__${eggName}`] || 0);
            const done = cur >= req;
            const eggImgUrl = getEggImgUrl(eggName);
            const safeEgg = eggName.replace(/'/g, "\\'");
            const uid = `${monster.id}_${instNum}_${eggIdx}`;

            return `
              <div class="egg-slot ${done ? 'slot-complete' : ''}"
                   oncontextmenu="adjustEggTally('${instKey}', '${safeEgg}', ${req}, 'minus', event)">
                <div class="egg-tap-area"
                     onclick="adjustEggTally('${instKey}', '${safeEgg}', ${req}, 'plus', event)"
                     title="Tap to add +1 ${eggName}">
                  <div class="egg-stage">
                    <div class="egg-sprite-wrap">
                      ${buildEggSVG(eggName, uid)}
                      <img class="egg-img" src="${eggImgUrl}" alt="" loading="lazy"
                           onload="if(this.previousElementSibling)this.previousElementSibling.style.display='none'"
                           onerror="this.style.display='none'" />
                      <svg class="egg-scribble" viewBox="0 0 40 44">
                        <path d="M4,6 L36,38 M36,6 L4,38 M2,22 L38,18 M6,32 L34,10"
                              stroke="#d41c1c" stroke-width="4" stroke-linecap="round"/>
                      </svg>
                    </div>
                    <span class="egg-counter-badge">${cur}/${req}</span>
                  </div>
                  <div class="egg-name-label">${eggName}</div>
                  <div class="tally-row">${formatTalliesHTML(cur)}</div>
                </div>

                <div class="slot-btn-row">
                  <button class="slot-micro-btn" onclick="adjustEggTally('${instKey}', '${safeEgg}', ${req}, 'minus', event)" title="Subtract 1">-</button>
                  <button class="slot-micro-btn slot-btn-plus" onclick="adjustEggTally('${instKey}', '${safeEgg}', ${req}, 'plus', event)" title="Add 1">+</button>
                  <button class="slot-micro-btn slot-btn-max" onclick="adjustEggTally('${instKey}', '${safeEgg}', ${req}, 'max', event)" title="Max / Cross Out">MAX</button>
                </div>
              </div>
            `;
          }).join("");

          board.innerHTML = `
            <!-- Left Column: Monster Medallion, Name, Time Limit & Copies Stepper -->
            <div class="monster-pedestal-col">
              <div class="pedestal-left-wrap">
                <div class="monster-medallion">
                  <img class="monster-img" src="${monsterImgUrl}" alt="${monster.name}" loading="lazy"
                       onerror="this.style.display='none'" />
                  ${totalCopies > 1 ? `<span class="copy-number-tag">#${idx + 1}</span>` : ""}
                </div>
                <div>
                  <div class="monster-title">${displayTitle}</div>
                  ${monster.time && monster.time !== "-" ? `<span class="time-badge">Time Limit: ${monster.time}</span>` : ""}
                </div>
              </div>

              <div class="copies-stepper" title="Track multiple copies of ${monster.name}">
                <span class="copies-label">Copies:</span>
                <button class="stepper-btn" onclick="decrementMonsterCopy('${monster.id}')">-</button>
                <span class="copies-val">${totalCopies}</span>
                <button class="stepper-btn" onclick="addMonsterCopy('${monster.id}')">+</button>
              </div>
            </div>

            <!-- Middle Column: Recessed Egg Slots & Progress Meter -->
            <div class="inventory-well-col">
              <div class="eggs-slot-grid">${eggsHTML}</div>
              <div class="meter-bar-wrap">
                <div class="meter-track">
                  <div class="meter-fill" style="width:${pct}%"></div>
                </div>
                <div class="meter-label">
                  ${isCompleted ? "AWAKENED (100%)" : `${totalZapped} / ${totalReq} Eggs Zapped (${totalReq - totalZapped} Remaining)`}
                </div>
              </div>
            </div>

            <!-- Right Column: Statue Action Buttons -->
            <div class="board-actions-col">
              <button class="game-btn ${isPinned ? 'game-btn-gold' : ''}" onclick="togglePinInstance('${instKey}')">
                ${isPinned ? "📌 Pinned" : "📌 Pin Statue"}
              </button>
              <button class="game-btn game-btn-blue" onclick="addMonsterCopy('${monster.id}')">
                Add Copy
              </button>
              <button class="game-btn game-btn-green" onclick="fillAllInstance('${monster.id}', '${instKey}')">
                Fill All
              </button>
              <button class="game-btn" onclick="clearInstance('${monster.id}', '${instKey}')">
                Clear Eggs
              </button>
              ${totalCopies > 1 ? `
                <button class="game-btn game-btn-red" onclick="removeMonsterCopy('${monster.id}', ${instNum})">
                  Remove #${idx + 1}
                </button>
              ` : ""}
            </div>
          `;

          container.appendChild(board);
        });
      });
    }

    function resetCurrentTab() {
      if (!confirm(`Reset all tallies and extra copies for ${currentTab.toUpperCase()}?`)) return;
      const monsters = MONSTER_DB[currentTab] || [];
      monsters.forEach(m => {
        const instances = getInstancesForMonster(m.id);
        instances.forEach(instNum => {
          const instKey = `${m.id}#${instNum}`;
          delete state.pinned[instKey];
          m.eggs.forEach(([eggName]) => {
            delete state.tallies[`${instKey}__${eggName}`];
          });
        });
        delete state.instances[m.id];
      });
      saveState();
      render();
    }

    function exportProgress() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `msm-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importProgress(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.tallies) {
            state = parsed;
            state.instances = state.instances || {};
            state.pinned = state.pinned || {};
            saveState();
            render();
          }
        } catch (err) {
          alert("Invalid backup JSON file.");
        }
      };
      reader.readAsText(file);
    }

    render();
    syncOnlineSprites();
  </script>
</body>
</html>
